<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrindSheet</title>
    <meta name="description" content="Track your fitness progress with friends" />
    <meta name="author" content="Your Name" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <meta name="theme-color" content="#00ddc4" id="initial-theme-color">

    <meta property="og:title" content="GrindSheet" />
    <meta property="og:description" content="GrindSheet" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" id="dynamic-favicon" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var html = document.documentElement;
          var body = document.body;
          var color = isDark ? '#0f0f0c' : '#00ddc4';

          if (isDark) html.classList.add('dark');
          html.style.background = color;
          if (body) body.style.background = color;

          // Set or update theme-color meta
          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) {
            meta = document.createElement('meta');
            meta.name = 'theme-color';
            document.head.appendChild(meta);
          }
          meta.setAttribute('content', color);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
